# Streaming for the proxy, and for nothing else on this server.
#
# mod_proxy_fcgi defaults to flushpackets=off: it hands PHP's output up the
# filter chain without a flush bucket, so Apache's core output filter holds it
# until roughly 8 KB or the end of the request. A normal JSON endpoint never
# notices. An SSE stream is destroyed by it — every delta of a turn arrives at
# once, at the end, which in the app looks like a freeze followed by a wall of
# text.
#
# The fix is flushpackets=on, and the reason this file names its own backend is
# to keep that setting off everything else. "fcgi://companion-ai" is not a
# hostname that gets resolved; it is a worker name. It points at the same
# php-fpm socket as the default handler, so this adds no process and no port —
# it is the same backend under a second name, whose flush behaviour is ours to
# set. The endpoints in the document root keep using the default worker and are
# served exactly as before.
#
# The <Proxy> block repeats the socket path because a unix-socket worker is
# named by the whole "unix:...|fcgi://..." string. Naming only the fcgi:// half
# defines a second, unused worker, and the setting silently does nothing.

<Directory "/var/www/html/ai">
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://companion-ai"
    </FilesMatch>
</Directory>

<Proxy "unix:/run/php-fpm/www.sock|fcgi://companion-ai">
    ProxySet flushpackets=on
</Proxy>
